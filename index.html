
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Between the Lines | Podcast & Media</title>
    <meta
      name="description"
      content="Between the Lines brings you thoughtful conversations, inspiring stories and perspectives that explore the people and ideas behind the headlines."
    />
    <meta name="author" content="Between the Lines" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FDF6E9" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/logo/between-the-lines-logo.png"
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Between the Lines" />
    <meta
      property="og:title"
      content="Between the Lines | Podcast & Media"
    />
    <meta
      property="og:description"
      content="Thoughtful conversations, inspiring stories and perspectives beyond the headlines."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Social Sharing Image -->
    <meta
      property="og:image"
      content="https://YOUR-DOMAIN.com/images/host-studio.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Between the Lines Podcast - Beyond the title. Behind the story."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Between the Lines | Podcast & Media"
    />
    <meta
      name="twitter:description"
      content="Thoughtful conversations, inspiring stories and perspectives beyond the headlines."
    />
    <meta
      name="twitter:image"
      content="https://YOUR-DOMAIN.com/images/og-between-the-lines.png"
    />
    <meta
      name="twitter:image:alt"
      content="Between the Lines Podcast - Beyond the title. Behind the story."
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
